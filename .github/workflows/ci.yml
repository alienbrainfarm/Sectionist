name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          cd backend
          flake8 . --count --statistics

      - name: Check formatting with black
        run: |
          cd backend
          black --check --diff .

      - name: Run tests
        run: |
          cd backend
          pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-tests:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      # Qt needs a rendering backend, and python-vlc needs libvlc present at
      # import time even though the tests never play audio.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libvlc5 libvlccore9

      - name: Install dependencies
        run: |
          cd frontend
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8 black

      - name: Lint with flake8
        run: |
          cd frontend
          flake8 . --count --statistics

      - name: Check formatting with black
        run: |
          cd frontend
          black --check --diff .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd frontend
          pytest -v

  integration-tests:
    name: Integration
    runs-on: ubuntu-latest
    needs: [backend-tests]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend and run end-to-end smoke test
        run: |
          cd backend
          python server.py &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/health
          curl -fsS http://127.0.0.1:5000/formats
          python smoke_test.py
